<ion-content [fullscreen]="true" class="dashboard-content">
  <div class="dashboard-container">
    
    <!-- Top Header -->
    <div class="header-section">
      <div class="header-text">
        <h1 class="page-title">Officer Dashboard</h1>
        <p class="page-subtitle">Monitoring Fun Zone entry point Alpha-1</p>
      </div>
    </div>

    <!-- Stats Section (Today's Entries Only) -->
    <div class="stats-wrapper">
      
      <!-- Card 1: Today's Entries (Full Width) -->
      <div class="stat-card full-card">
        <div class="card-left">
          <span class="card-label">Today's Entries</span>
          <h2 class="card-value main-value">
            <ng-container *ngIf="!isLoading || todayEntries !== null; else loadingTemplate">
              {{ todayEntries !== null ? todayEntries : 0 }}
            </ng-container>
            <ng-template #loadingTemplate>
              <ion-spinner name="dots"></ion-spinner>
            </ng-template>
          </h2>
        </div>
        <div class="card-badge primary-badge">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
      </div>

      <!-- Quick Link Button to Scan Result Page -->
      <button type="button" class="result-link-btn" (click)="openScanResult()">
        <ion-icon name="document-text-outline"></ion-icon>
        <span>View Scan Result Page</span>
      </button>

    </div>

  </div>
</ion-content>
