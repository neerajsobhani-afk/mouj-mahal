<ion-content [fullscreen]="true" class="scan-content">
  <div class="scan-container">
    
    <!-- Top Scanner Title -->
    <div class="scan-header">
      <h1 class="scan-title">QR Ticket Scanner</h1>
      <p class="scan-subtitle">Scan ticket or parking QR code to get Order ID</p>
    </div>

    <!-- Active Scanner Frame -->
    <div class="scanner-card">
      <div class="scanner-viewfinder">
        <span class="corner top-left"></span>
        <span class="corner top-right"></span>
        <span class="corner bottom-left"></span>
        <span class="corner bottom-right"></span>
        
        <div class="scan-laser" *ngIf="isScanning"></div>

        <div class="center-content">
          <ion-icon name="qr-code-outline" class="qr-icon"></ion-icon>
        </div>
      </div>

      <!-- Action Button -->
      <button type="button" class="scan-btn" (click)="startScan()" [disabled]="isScanning || isVerifying">
        <ion-icon name="camera-outline" *ngIf="!isScanning && !isVerifying"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isScanning || isVerifying"></ion-spinner>
        <span>{{ isScanning ? 'Scanning...' : isVerifying ? 'Verifying Order...' : 'Start QR Scanner' }}</span>
      </button>
    </div>

  </div>
</ion-content>
